name: Sign In-Toto Statement (Sigstore Keyless)

# Reusable workflow: the trusted signing boundary for tenax-assay-produced
# attestations. Called via `uses: tenax-io/tenax-attest/.github/workflows/
# sign.yml@<pinned-sha>` from a *calling* repo's own job (see
# tenax-io/tenax-assay's .github/workflows/assay.yml `attest` job) -- never
# invoked directly.
#
# Why this lives in its own repo rather than as a job inside the calling
# repo's own workflow file: env.TRUSTED_SIGNER_SHA below is a commit SHA of
# tenax-io/tenax-assay hardcoded in *this* file -- it is deliberately NOT a
# `workflow_call` input the caller can set. What actually executes is this
# file, checked out from THIS repo at whatever ref the caller's `uses:`
# line pins (see that line's own `# vX` comment for which one), so a PR to
# tenax-assay that rewrites its own workflow file, or the pipeline code
# TRUSTED_SIGNER_SHA points at, cannot also rewrite what this job trusts --
# neither is part of that PR's diff at all, and neither can steer this job
# to check out a different tenax-assay ref than the one pinned here.
# Bumping TRUSTED_SIGNER_SHA (which tenax-assay commit's cli/sign.py +
# cli/oidc_signer.py this job trusts enough to check out and run) is a
# separate, deliberate, reviewable commit to *this* repo -- never something
# a caller-side compromise (a malicious `workflow_call` input, a rewritten
# assay.yml) can do by itself.
#
# A caller-controlled `signer-ref` input previously existed here and was
# removed deliberately: the privileged job below (id-token: write) must
# never execute code checked out from a ref an untrusted caller supplies
# dynamically, no matter how independently that ref was described as
# "pinned" -- the caller, not this repo, would still control the value.
#
# id-token: write is granted to exactly one job, in exactly one workflow,
# in this one repo. No other job anywhere in the calling repo's own
# workflow has it (see assay.yml's top-level `permissions:` comment).
#
# SLSA Build Level 3 -- provenance CONSTRUCTION, not just signing:
# subject-name/subject-digest (below) are the only provenance-relevant
# values this job accepts from the caller, and they're inherently caller-
# supplied even in the reference SLSA GitHub generator (the built
# artifact's own digest can't come from anywhere else). Everything else
# that makes a provenance statement SLSA-meaningful -- builder identity,
# source-repository binding, resolved dependencies -- is derived from
# *this job's own* ambient GitHub Actions context (which, for a
# workflow_call job, is authoritatively the calling workflow run's own
# GITHUB_REPOSITORY/_SHA -- unspoofable by the caller's workflow YAML)
# and its own read-only checkout of the source commit, never from a
# value the untrusted build job computed and handed over. That's what
# closes the gap tenax-assay's README calls out: a compromised build job
# can no longer forge buildDefinition/runDetails, because it no longer
# constructs them at all -- only this isolated job does, atomically with
# signing. See tenax-assay's cli/provenance.py for the construction logic
# this job runs (checked out at TRUSTED_SIGNER_SHA below, same as the
# signing surface already was).

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the workflow-run artifact containing the unsigned *.unsigned.json statement files"
        required: true
        type: string
      statement-files:
        description: "Newline-separated list of *.unsigned.json filenames (within artifact-name) to sign"
        required: true
        type: string
      subject-name:
        description: "Optional: the attested artifact's name (e.g. an image ref). Together with subject-digest, opts this run into also constructing a SLSA v1.0 provenance statement inside this isolated job (SLSA Build Level 3) and signing it alongside the caller's own statement(s). Omit both to keep signing exactly the files named in statement-files, unchanged from before this input existed."
        required: false
        type: string
        default: ""
      subject-digest:
        description: "Optional: sha256:<hex> or bare hex digest of the artifact named by subject-name. Required together with subject-name; ignored if subject-name is empty."
        required: false
        type: string
        default: ""
      dry-run-sign:
        description: "Simulate DSSE envelope creation without a real OIDC/Sigstore round-trip"
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the workflow-run artifact this job uploads the signed *.dsse.json envelopes to"
        value: signed-statements

permissions: {}

# The one and only commit of tenax-io/tenax-assay this job will ever check
# out cli/sign.py + cli/oidc_signer.py + cli/provenance.py from. Hardcoded
# here rather than accepted as a workflow_call input -- see the file
# header for why. Bump this in its own deliberate, reviewed commit to
# *this* repo whenever tenax-assay's signing/provenance surface should
# move; never point it at a branch, and never accept it as a value from
# the calling workflow.
#
# CONTROL_PLANE_BUILDER_ID is this job's own identity, asserted into the
# SLSA provenance statement's runDetails.builder.id (see the "Construct
# SLSA Provenance" step below) -- and it MUST be passed to
# `cli.main provenance` explicitly via --builder-id, never left to that
# subcommand's own ambient-derivation fallback. A real run proved why:
# GITHUB_WORKFLOW_REF inside this job reflects the top-level *calling*
# workflow (e.g. some caller repo's own assay.yml), not this reusable
# sign.yml actually executing the job -- so ambient derivation asserted
# the caller's identity, not this job's, and cli/verify.py's SLSA Build
# Level 2/3 checks correctly, fail-closed rejected the mismatch. This is
# a hardcoded literal, not derived from ${{ github.repository }} either,
# for the same reason: that context value is also the caller's repo in a
# workflow_call job, not tenax-io/tenax-attest.
env:
  TRUSTED_SIGNER_SHA: 7884d3e56a3fc50a1d8ee5997f026594d27c84c2 # tenax-assay main: fix(builder-id-explicit-override)
  CONTROL_PLANE_BUILDER_ID: https://github.com/tenax-io/tenax-attest/.github/workflows/sign.yml

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting -- see file header
      contents: read

    steps:
      # Explicit repository:/ref: -- this is NOT a self-checkout of
      # tenax-attest. It checks out tenax-io/tenax-assay at the hardcoded
      # env.TRUSTED_SIGNER_SHA above (never anything caller-supplied), into
      # a subdirectory, purely to get the small, stable cli/sign.py +
      # cli/oidc_signer.py signing surface (see those files' own
      # docstrings) -- nothing from the calling build job's own checkout
      # is trusted or reused here.
      - name: Checkout Pinned tenax-assay Signer Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tenax-io/tenax-assay
          ref: ${{ env.TRUSTED_SIGNER_SHA }}
          path: _signer

      # Read-only, for lockfile scanning ONLY -- nothing from this checkout
      # is ever executed (no build/test/install step touches it). `github.sha`
      # here is the *calling* workflow run's own commit (workflow_call jobs
      # inherit the caller's github.* context; only GITHUB_WORKFLOW_REF
      # below is this job's own), so this is genuinely the source commit
      # the caller's build job built from, not anything it could redirect.
      # Skipped entirely when the caller didn't opt into provenance
      # construction (no subject-name given).
      - name: Checkout Caller Source (read-only, for dependency scanning only)
        if: inputs['subject-name'] != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "_signer/uv.lock"

      - name: Install Signer Dependencies
        working-directory: _signer
        run: uv sync --frozen --extra dev

      - name: Cache Sigstore TUF Metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}-${{ env.TRUSTED_SIGNER_SHA }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download Unsigned Statements
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact-name }}
          path: unsigned

      # Constructs a SLSA v1.0 provenance statement from THIS job's own
      # ambient GitHub Actions context (cli/provenance.py, checked out
      # above at the same TRUSTED_SIGNER_SHA as the signing surface) --
      # source binding and resolved dependencies come from here, never
      # from anything the untrusted build job claims. --builder-id is
      # passed explicitly (env.CONTROL_PLANE_BUILDER_ID, see its own
      # comment above for why this must not be left to cli.main
      # provenance's ambient-derivation fallback). Written into ./unsigned/
      # alongside the caller's own statement(s) purely so the signing loop
      # below can treat it identically; it was not part of what the
      # caller uploaded.
      - name: Construct SLSA Provenance (Build Level 3)
        if: inputs['subject-name'] != ''
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
          BUILDER_ID: ${{ env.CONTROL_PLANE_BUILDER_ID }}
        run: |
          (cd _signer && uv run --no-sync python -m cli.main provenance \
            --subject-name "$SUBJECT_NAME" \
            --subject-digest "$SUBJECT_DIGEST" \
            --repo-dir ../_source \
            --builder-id "$BUILDER_ID" \
            --out ../unsigned/provenance.unsigned.json)

      # Signs exactly the files the caller named, nothing else -- a file
      # present in the artifact but not listed in inputs.statement-files
      # is silently ignored, not swept up. Each `tenax-assay sign` call
      # (cli/sign.py, checked out above) reads only that one file's bytes;
      # it never touches anything else this job downloaded.
      #
      # inputs.statement-files is caller-supplied, so every line read out of
      # it is treated as hostile input, not a trusted filename, before it
      # touches the filesystem or the Python CLI:
      #   - rejected outright if it contains `/`, `\`, or `..` -- a bare
      #     filename can never walk outside ./unsigned/ (the only directory
      #     this step ever reads from) via a path-traversal or separator
      #     sequence.
      #   - `basename -- "$f" ...` (the `--`) stops a hyphen-prefixed
      #     filename (e.g. "--help.unsigned.json") from being parsed as a
      #     flag by basename itself.
      - name: Sign Statements
        env:
          STATEMENT_FILES: ${{ inputs.statement-files }}
          SUBJECT_NAME: ${{ inputs.subject-name }}
          DRY_RUN_SIGN: ${{ inputs.dry-run-sign }}
        run: |
          mkdir -p signed
          DRY_RUN_ARGS=()
          if [ "$DRY_RUN_SIGN" = "true" ]; then
            DRY_RUN_ARGS=(--dry-run-sign)
          fi

          # The just-constructed provenance statement (see "Construct SLSA
          # Provenance" above) is signed the same way as every caller-named
          # file below -- appended here, not by trusting anything in
          # inputs.statement-files, so a caller can't rename/omit it to
          # dodge or duplicate this signing pass.
          ALL_FILES="$STATEMENT_FILES"
          if [ -n "$SUBJECT_NAME" ]; then
            ALL_FILES="$ALL_FILES"$'\n'"provenance.unsigned.json"
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              */*|*\\*|*..*)
                echo "ERROR: rejecting unsafe statement filename: $f" >&2
                exit 1
                ;;
            esac

            base="$(basename -- "$f" .unsigned.json)"
            (cd _signer && uv run --no-sync python -m cli.main sign \
              "../unsigned/$f" --out "../signed/${base}.dsse.json" "${DRY_RUN_ARGS[@]}")
          done <<< "$ALL_FILES"

      - name: Upload Signed Statements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-statements
          path: signed/
          if-no-files-found: error
