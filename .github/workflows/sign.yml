name: Sign In-Toto Statement (Sigstore Keyless)

# Reusable workflow: the trusted signing boundary for lucid-assay-produced
# attestations. Called via `uses: lucid-provenance/lucid-attest/.github/workflows/
# sign.yml@<pinned-sha>` from a *calling* repo's own job (see
# lucid-provenance/lucid-assay's .github/workflows/assay.yml `attest` job) -- never
# invoked directly.
#
# Migrated 2026-08-31 (Lucid roadmap Milestone #18) from checking out
# lucid-assay's source + `uv sync` on the runner, to `docker run` against
# an immutable, Sigstore-signed image built by build-signer-image.yml. See
# this repo's Dockerfile header for the full "what this closes, precisely"
# rationale -- summary: uv.lock --frozen already made dependency
# *integrity* deterministic; this closes OS/interpreter drift and a live
# runtime dependency on PyPI's availability, on this one job.
#
# Why this lives in its own repo rather than as a job inside the calling
# repo's own workflow file: env.TRUSTED_SIGNER_IMAGE_DIGEST below is an
# image digest of a lucid-attest-signer build hardcoded in *this* file --
# it is deliberately NOT a `workflow_call` input the caller can set. What
# actually executes is this file, checked out from THIS repo at whatever
# ref the caller's `uses:` line pins (see that line's own `# vX` comment
# for which one), so a PR to lucid-assay that rewrites its own workflow
# file, or the pipeline code the image was built from, cannot also rewrite
# what this job trusts -- neither is part of that PR's diff at all, and
# neither can steer this job to run a different image than the one pinned
# here.
# Bumping TRUSTED_SIGNER_IMAGE_DIGEST (which built image this job trusts
# enough to run) is a separate, deliberate, reviewable commit to *this*
# repo -- never something a caller-side compromise (a malicious
# `workflow_call` input, a rewritten assay.yml) can do by itself. See
# build-signer-image.yml for how a new digest actually gets produced --
# that workflow's own SIGNER_SOURCE_SHA is the one place a lucid-assay
# commit gets trusted; this file trusts only the resulting image digest,
# never a source ref directly, and never rebuilds anything itself.
#
# A caller-controlled `signer-ref` input previously existed here and was
# removed deliberately: the privileged job below (id-token: write) must
# never execute code checked out from a ref an untrusted caller supplies
# dynamically, no matter how independently that ref was described as
# "pinned" -- the caller, not this repo, would still control the value.
# The same discipline now applies one layer down: the image tag/digest
# below is equally never caller-suppliable.
#
# id-token: write is granted to exactly one job, in exactly one workflow,
# in this one repo. No other job anywhere in the calling repo's own
# workflow has it (see assay.yml's top-level `permissions:` comment).
#
# SLSA Build Level 3 -- provenance CONSTRUCTION, not just signing:
# subject-name/subject-digest (below) are the only provenance-relevant
# values this job accepts from the caller, and they're inherently caller-
# supplied even in the reference SLSA GitHub generator (the built
# artifact's own digest can't come from anywhere else). Everything else
# that makes a provenance statement SLSA-meaningful -- builder identity,
# source-repository binding, resolved dependencies -- is derived from
# *this job's own* ambient GitHub Actions context (which, for a
# workflow_call job, is authoritatively the calling workflow run's own
# GITHUB_REPOSITORY/_SHA -- unspoofable by the caller's workflow YAML)
# and its own read-only checkout of the source commit, never from a
# value the untrusted build job computed and handed over. That's what
# closes the gap lucid-assay's README calls out: a compromised build job
# can no longer forge buildDefinition/runDetails, because it no longer
# constructs them at all -- only this isolated job does, atomically with
# signing. The container image (see Dockerfile) packages the exact
# construction logic this job runs; ambient GITHUB_* env vars are passed
# through explicitly below since `docker run` does not inherit the host
# runner's environment implicitly.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the workflow-run artifact containing the unsigned *.unsigned.json statement files"
        required: true
        type: string
      statement-files:
        description: "Newline-separated list of *.unsigned.json filenames (within artifact-name) to sign"
        required: true
        type: string
      subject-name:
        description: "Optional: the attested artifact's name (e.g. an image ref). Together with subject-digest, opts this run into also constructing a SLSA v1.0 provenance statement inside this isolated job (SLSA Build Level 3) and signing it alongside the caller's own statement(s). Omit both to keep signing exactly the files named in statement-files, unchanged from before this input existed."
        required: false
        type: string
        default: ""
      subject-digest:
        description: "Optional: sha256:<hex> or bare hex digest of the artifact named by subject-name. Required together with subject-name; ignored if subject-name is empty."
        required: false
        type: string
        default: ""
      dry-run-sign:
        description: "Simulate DSSE envelope creation without a real OIDC/Sigstore round-trip"
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the workflow-run artifact this job uploads the signed *.dsse.json envelopes to"
        value: signed-statements

permissions: {}

# The one and only signer image this job will ever run. Hardcoded here
# rather than accepted as a workflow_call input -- see the file header for
# why. Bump this in its own deliberate, reviewed commit to *this* repo
# whenever build-signer-image.yml publishes a new image that should take
# over signing; never point it at a mutable tag, and never accept it as a
# value from the calling workflow.
#
# CONTROL_PLANE_BUILDER_ID is this job's own identity, asserted into the
# SLSA provenance statement's runDetails.builder.id (see the "Construct
# SLSA Provenance" step below) -- and it MUST be passed to the container's
# `provenance` subcommand explicitly via --builder-id, never left to that
# subcommand's own ambient-derivation fallback. A real run proved why:
# GITHUB_WORKFLOW_REF inside this job reflects the top-level *calling*
# workflow (e.g. some caller repo's own assay.yml), not this reusable
# sign.yml actually executing the job -- so ambient derivation asserted
# the caller's identity, not this job's, and cli/verify.py's SLSA Build
# Level 2/3 checks correctly, fail-closed rejected the mismatch. This is
# a hardcoded literal, not derived from ${{ github.repository }} either,
# for the same reason: that context value is also the caller's repo in a
# workflow_call job, not lucid-provenance/lucid-attest.
env:
  # Produced by build-signer-image.yml's first real run against
  # SIGNER_SOURCE_SHA 5be1735eccce45b63235cdffda0380cb73cf2cf5 (lucid-assay
  # main, PR #51). Pasted from the "Build and push signer image" step's
  # own log output (the `digest:` line docker/build-push-action prints) --
  # not independently re-verified against the registry (this image is a
  # private GHCR package; no anonymous pull token was available to confirm
  # it from here). If this digest is ever wrong, the failure mode is a
  # loud, safe one: `docker pull`/`docker run` fails outright in the Sign
  # Statements step below, not a silent substitution of a different image.
  TRUSTED_SIGNER_IMAGE_DIGEST: ghcr.io/lucid-provenance/lucid-attest-signer@sha256:1b316a156cfcf09b1b0885d0831abd66dc07fc9eb86e8210bf18499eca579c6f
  CONTROL_PLANE_BUILDER_ID: https://github.com/lucid-provenance/lucid-attest/.github/workflows/sign.yml

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Sigstore keyless OIDC minting -- see file header
      contents: read

    steps:
      # Read-only, for lockfile scanning ONLY -- nothing from this checkout
      # is ever executed (no build/test/install step touches it). `github.sha`
      # here is the *calling* workflow run's own commit (workflow_call jobs
      # inherit the caller's github.* context; only GITHUB_WORKFLOW_REF
      # below is this job's own), so this is genuinely the source commit
      # the caller's build job built from, not anything it could redirect.
      # Skipped entirely when the caller didn't opt into provenance
      # construction (no subject-name given). Mounted read-only into the
      # container below -- the image itself never contains any caller's
      # source, only lucid-assay's own signing/provenance code.
      - name: Checkout Caller Source (read-only, for dependency scanning only)
        if: inputs['subject-name'] != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: _source
          persist-credentials: false

      - name: Cache Sigstore TUF Metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/sigstore-python
          key: sigstore-tuf-${{ runner.os }}-${{ env.TRUSTED_SIGNER_IMAGE_DIGEST }}
          restore-keys: |
            sigstore-tuf-${{ runner.os }}-

      - name: Download Unsigned Statements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: unsigned

      # Host-side directories, created before any bind mount: an
      # unmounted destination path handed to `docker run -v` gets
      # auto-created by the Docker daemon (running as root) if it doesn't
      # already exist, which would make it unwritable by the non-root
      # `--user "$(id -u):$(id -g)"` override every docker run call below
      # uses. Creating them here, as the runner's own user, avoids that
      # entirely. actions/cache above may already have created the TUF
      # cache dir; -p makes that a no-op either way.
      - name: Prepare host directories for container mounts
        run: |
          mkdir -p signed
          mkdir -p "$HOME/.local/share/sigstore-python"

      # Constructs a SLSA v1.0 provenance statement from THIS job's own
      # ambient GitHub Actions context (cli/provenance.py, packaged into
      # the pinned signer image above) -- source binding and resolved
      # dependencies come from here, never from anything the untrusted
      # build job claims. --builder-id is passed explicitly
      # (env.CONTROL_PLANE_BUILDER_ID, see its own comment above for why
      # this must not be left to the container's ambient-derivation
      # fallback). Written into ./unsigned/ alongside the caller's own
      # statement(s) purely so the signing loop below can treat it
      # identically; it was not part of what the caller uploaded.
      #
      # `docker run` does not inherit the runner's environment implicitly
      # -- every ambient GITHUB_* value cli.provenance's own
      # ambient-derivation reads (see cli/slsa_provenance.py) is passed
      # through explicitly via bare `-e VARNAME`, which forwards the
      # value from this step's own shell environment without ever writing
      # it into the command line itself.
      - name: Construct SLSA Provenance (Build Level 3)
        if: inputs['subject-name'] != ''
        env:
          SUBJECT_NAME: ${{ inputs.subject-name }}
          SUBJECT_DIGEST: ${{ inputs.subject-digest }}
          BUILDER_ID: ${{ env.CONTROL_PLANE_BUILDER_ID }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_REPOSITORY \
            -e GITHUB_SERVER_URL \
            -e GITHUB_SHA \
            -e GITHUB_WORKFLOW_REF \
            -e GITHUB_RUN_ID \
            -e GITHUB_RUN_ATTEMPT \
            -e RUNNER_ENVIRONMENT \
            -v "$PWD/_source:/workspace/_source:ro" \
            -v "$PWD/unsigned:/workspace/unsigned" \
            "$TRUSTED_SIGNER_IMAGE_DIGEST" \
            provenance \
              --subject-name "$SUBJECT_NAME" \
              --subject-digest "$SUBJECT_DIGEST" \
              --repo-dir /workspace/_source \
              --builder-id "$BUILDER_ID" \
              --out /workspace/unsigned/provenance.unsigned.json

      # Signs exactly the files the caller named, nothing else -- a file
      # present in the artifact but not listed in inputs.statement-files
      # is silently ignored, not swept up. Each `docker run` invocation
      # (the pinned signer image, see Dockerfile) reads only that one
      # file's bytes; it never touches anything else this job downloaded.
      #
      # inputs.statement-files is caller-supplied, so every line read out of
      # it is treated as hostile input, not a trusted filename, before it
      # touches the filesystem or the container:
      #   - rejected outright if it contains `/`, `\`, or `..` -- a bare
      #     filename can never walk outside ./unsigned/ (the only directory
      #     this step ever reads from) via a path-traversal or separator
      #     sequence.
      #   - `basename -- "$f" ...` (the `--`) stops a hyphen-prefixed
      #     filename (e.g. "--help.unsigned.json") from being parsed as a
      #     flag by basename itself.
      #
      # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN are the ambient OIDC
      # credentials cli.oidc_signer fetches its Sigstore identity token
      # from -- forwarded by bare `-e VARNAME` (value taken from this
      # step's own environment, never written into the command line or
      # this file), the only way they reach the container at all since
      # `docker run` does not inherit the runner's environment implicitly.
      - name: Sign Statements
        env:
          STATEMENT_FILES: ${{ inputs.statement-files }}
          SUBJECT_NAME: ${{ inputs.subject-name }}
          DRY_RUN_SIGN: ${{ inputs.dry-run-sign }}
        run: |
          DRY_RUN_ARGS=()
          if [ "$DRY_RUN_SIGN" = "true" ]; then
            DRY_RUN_ARGS=(--dry-run-sign)
          fi

          # The just-constructed provenance statement (see "Construct SLSA
          # Provenance" above) is signed the same way as every caller-named
          # file below -- appended here, not by trusting anything in
          # inputs.statement-files, so a caller can't rename/omit it to
          # dodge or duplicate this signing pass.
          ALL_FILES="$STATEMENT_FILES"
          if [ -n "$SUBJECT_NAME" ]; then
            ALL_FILES="$ALL_FILES"$'\n'"provenance.unsigned.json"
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            case "$f" in
              */*|*\\*|*..*)
                echo "ERROR: rejecting unsafe statement filename: $f" >&2
                exit 1
                ;;
            esac

            base="$(basename -- "$f" .unsigned.json)"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e ACTIONS_ID_TOKEN_REQUEST_URL \
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              -v "$PWD/unsigned:/workspace/unsigned:ro" \
              -v "$PWD/signed:/workspace/signed" \
              -v "$HOME/.local/share/sigstore-python:/tmp/.local/share/sigstore-python" \
              "$TRUSTED_SIGNER_IMAGE_DIGEST" \
              sign "/workspace/unsigned/$f" \
                --out "/workspace/signed/${base}.dsse.json" \
                "${DRY_RUN_ARGS[@]}"
          done <<< "$ALL_FILES"

      - name: Upload Signed Statements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-statements
          path: signed/
          if-no-files-found: error
