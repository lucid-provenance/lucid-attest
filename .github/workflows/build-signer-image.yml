name: Build & Publish Signer Image

# Produces the immutable, Sigstore-signed image sign.yml's
# TRUSTED_SIGNER_IMAGE_DIGEST pins (Lucid roadmap Milestone #18). Not
# triggered on push/PR -- publishing a new trusted signer image is a
# deliberate, infrequent action a maintainer takes on purpose, the same
# way bumping a pinned SHA always has been here, not something that
# should happen implicitly as a side effect of routine CI.
#
# Trust model, mirrored from sign.yml's own (see that file's header):
# env.SIGNER_SOURCE_SHA below is the ONLY thing that determines which
# lucid-assay commit's cli/sign.py + cli/oidc_signer.py + cli/provenance.py
# end up in the published image. It is a hardcoded literal in *this* repo,
# never a workflow_dispatch input -- this workflow intentionally takes no
# inputs at all, so there is no caller-controlled value anywhere in this
# pipeline that could steer which source it builds from. Bumping
# SIGNER_SOURCE_SHA is a separate, deliberate, reviewable commit to this
# repo, exactly like bumping sign.yml's TRUSTED_SIGNER_SHA always was.
#
# What this produces is a candidate value for TRUSTED_SIGNER_IMAGE_DIGEST
# in sign.yml -- it does NOT update that file automatically. Propagating
# the digest from this workflow's output into sign.yml is its own
# deliberate, reviewed commit, same discipline as every other pin in this
# platform (see the Lucid roadmap's "Signer SHA pinning pain" for why that
# manual propagation step is a known, accepted limitation of this
# milestone, not an oversight).

on:
  workflow_dispatch: {}

permissions: {}

env:
  # TODO(before first real run): replace with the actual merged commit of
  # lucid-provenance/lucid-assay containing the cli.sign / cli.common
  # refactor that removes cli/sign.py's `from .main import
  # derive_signed_path` import (see that PR's own description). Building
  # this image against any earlier lucid-assay commit would copy in a
  # cli/sign.py that still imports cli.main -- which this Dockerfile
  # deliberately does not COPY in at all -- and the image would fail to
  # start. Deliberately left as an obviously-non-functional placeholder
  # rather than a fabricated-looking SHA, so this can't be run by
  # accident against the wrong source.
  SIGNER_SOURCE_SHA: "REPLACE_ME_pending_lucid-assay_narrow-import_PR_merge"
  IMAGE_NAME: ghcr.io/lucid-provenance/lucid-attest-signer

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Sigstore keyless signing of the image itself (cosign) -- same isolation posture as sign.yml's own signing job
      packages: write # Push to GHCR
      contents: read

    steps:
      - name: Checkout lucid-attest (this repo -- Dockerfile + docker/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read-only checkout of the one lucid-assay commit this build trusts
      # -- see this file's header for why env.SIGNER_SOURCE_SHA can never
      # be a workflow input.
      - name: Checkout Pinned lucid-assay Signer Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lucid-provenance/lucid-assay
          ref: ${{ env.SIGNER_SOURCE_SHA }}
          path: _signer
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by short source SHA for human traceability only -- this tag
      # is never what any consumer trusts or references. sign.yml always
      # pins the digest this step outputs, never this (or any) tag.
      # provenance/sbom attestation attachments are explicitly disabled:
      # this platform has its own SLSA provenance story (cli/provenance.py,
      # constructed inside sign.yml's own isolated job) -- letting
      # buildx/BuildKit attach a second, differently-shaped attestation to
      # the same image would just be a confusing second source of truth,
      # not additional real assurance.
      - name: Build and push signer image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:src-${{ env.SIGNER_SOURCE_SHA }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signing of the published image, by digest -- dogfoods the
      # platform's own trust model (Sigstore Fulcio/Rekor) on its own
      # build artifact, same as every DSSE envelope this platform signs
      # for a caller's own attestations.
      - name: Sign image with cosign (keyless)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Summarize published digest
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Signer image published"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE_DIGEST_REF"
            echo "\`\`\`"
            echo ""
            echo "Built from lucid-assay@\`${SIGNER_SOURCE_SHA}\`."
            echo ""
            echo "**Next step (manual, deliberate):** update"
            echo "\`TRUSTED_SIGNER_IMAGE_DIGEST\` in \`sign.yml\` to the digest"
            echo "above, in its own reviewed commit -- this workflow does not"
            echo "do that automatically."
          } >> "$GITHUB_STEP_SUMMARY"
